<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portofolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--surface:#fff;--ink:#14213d;--muted:#536079;--line:#d5dbe7;--accent:#2b59e0;--award:#b87400;--award-bg:#fff4d9}
@media (prefers-color-scheme:dark){:root{--bg:#0e1626;--surface:#16213a;--ink:#e9eefb;--muted:#9aa8c4;--line:#27344f;--accent:#7a9bff;--award:#f2b73d;--award-bg:#2a2412}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.65 Figtree,system-ui,sans-serif}
a{color:var(--accent)}
a:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:3px}
.wrap{display:grid;grid-template-columns:20rem 1fr;gap:4rem;max-width:72rem;margin:0 auto;padding:4rem 2rem}
aside{position:sticky;top:4rem;align-self:start}
aside img{width:7rem;height:7rem;border-radius:50%;object-fit:cover;margin-bottom:1.25rem}
h1{font:700 2.5rem/1.05 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;margin:0 0 1rem}
.headline{color:var(--muted);margin:0 0 1.5rem}
.contact{list-style:none;padding:0;margin:0 0 2rem;font-size:.975rem}
.contact li{margin-bottom:.25rem}
nav{display:flex;flex-direction:column;gap:.35rem;border-left:2px solid var(--line);padding-left:1rem}
nav a{color:var(--muted);text-decoration:none;font-weight:500}
nav a:hover{color:var(--accent)}
section{margin-bottom:3.5rem}
h2{font:700 1.5rem/1.2 "Bricolage Grotesque",sans-serif;margin:0 0 1.25rem}
.lead{max-width:62ch;margin:0}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:.5rem;padding:1.25rem 1.5rem;margin-bottom:1rem}
.entry h3{font:600 1.125rem/1.35 Figtree,sans-serif;margin:0}
.meta{display:flex;flex-wrap:wrap;gap:.25rem 1rem;color:var(--muted);font-size:.95rem;margin:.15rem 0 .6rem}
.entry p{margin:.4rem 0;max-width:68ch}
.entry ul{margin:.5rem 0 0;padding-left:1.15rem;max-width:68ch}
.entry li{margin-bottom:.3rem}
.award{border-left:4px solid var(--award);background:var(--award-bg)}
.skill{margin-bottom:1.1rem}
.skill h3{font:600 1rem/1.3 Figtree,sans-serif;margin:0 0 .4rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;list-style:none;padding:0;margin:0}
.chips li{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:.15rem .8rem;font-size:.95rem}
@media (max-width:56rem){.wrap{grid-template-columns:1fr;gap:2.5rem;padding:2.5rem 1.25rem}aside{position:static}nav{flex-direction:row;flex-wrap:wrap;border:0;padding:0;gap:.5rem 1.25rem}h1{font-size:2.1rem}}
</style>
</head>
<body>
<div class="wrap">
  <aside id="rail"></aside>
  <main id="main"><p>Memuat…</p></main>
</div>
<script>
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const k in (attrs || {})) n.setAttribute(k, attrs[k]);
  kids.flat().forEach(c => { if (c) n.append(c.nodeType ? c : document.createTextNode(c)); });
  return n;
}
const SECTIONS = [
  ["profil", "Profil", "summary"],
  ["proyek", "Proyek", "projects"],
  ["penghargaan", "Penghargaan", "awards"],
  ["pengalaman", "Pengalaman kerja dan akademik", "experience"],
  ["kepemimpinan", "Kepemimpinan dan organisasi", "leadership"],
  ["pendidikan", "Pendidikan", "education"],
  ["keterampilan", "Keterampilan", "skills"]
];
function entry(i, cls) {
  const meta = el("div", {class: "meta"}, i.org && el("span", {}, i.org), i.period && el("span", {}, i.period));
  return el("div", {class: "entry " + (cls || "")},
    el("h3", {}, i.title), meta,
    i.description && el("p", {}, i.description),
    i.points && i.points.length ? el("ul", {}, i.points.map(p => el("li", {}, p))) : null,
    i.link && /^https?:\/\//.test(i.link) ? el("p", {}, el("a", {href: i.link, rel: "noopener"}, "Lihat proyek")) : null);
}
function render(d) {
  document.title = d.name + " | Portofolio";
  const rail = document.getElementById("rail");
  rail.append(
    d.photo && /^[\w\/.\-]+$/.test(d.photo) ? el("img", {src: d.photo, alt: "Foto " + d.name}) : null,
    el("h1", {}, d.name),
    el("p", {class: "headline"}, d.headline),
    el("ul", {class: "contact"},
      d.location && el("li", {}, d.location),
      d.email && el("li", {}, el("a", {href: "mailto:" + d.email}, d.email)),
      /^https?:\/\//.test(d.github || "") && el("li", {}, el("a", {href: d.github, rel: "noopener"}, "GitHub")),
      /^https?:\/\//.test(d.linkedin || "") && el("li", {}, el("a", {href: d.linkedin, rel: "noopener"}, "LinkedIn"))),
    el("nav", {"aria-label": "Bagian halaman"}, SECTIONS.map(s => el("a", {href: "#" + s[0]}, s[1]))));
  const main = document.getElementById("main");
  main.textContent = "";
  SECTIONS.forEach(([id, title, key]) => {
    const v = d[key];
    if (!v || !v.length) return;
    let body;
    if (key === "summary") body = el("p", {class: "lead"}, v);
    else if (key === "skills") body = v.map(s => el("div", {class: "skill"}, el("h3", {}, s.group), el("ul", {class: "chips"}, (s.items || []).map(x => el("li", {}, x)))));
    else body = v.map(i => entry(i, key === "awards" ? "award" : ""));
    main.append(el("section", {id}, el("h2", {}, title), body));
  });
}
fetch("content/site.json").then(r => r.json()).then(render)
  .catch(() => { document.getElementById("main").textContent = "Konten gagal dimuat. Jika dibuka dari file lokal, jalankan server lokal (python -m http.server)."; });
</script>
</body>
</html>
