backend:
  name: github
     repo: Obt44/portobit   # ganti dengan repo GitHub kamu
  branch: main

media_folder: assets/uploads
public_folder: /assets/uploads
locale: id

collections:
  - name: portofolio
    label: Portofolio
    files:
      - name: site
        label: Isi Portofolio
        file: content/site.json
        format: json
        fields:
          - {label: Nama, name: name, widget: string}
          - {label: Headline, name: headline, widget: string}
          - {label: Lokasi, name: location, widget: string, required: false}
          - {label: Email, name: email, widget: string}
          - {label: Link GitHub, name: github, widget: string, required: false, hint: "Awali dengan https://"}
          - {label: Link LinkedIn, name: linkedin, widget: string, required: false, hint: "Awali dengan https://"}
          - {label: Foto, name: photo, widget: image, required: false}
          - {label: Profil singkat, name: summary, widget: text}
          - label: Proyek
            name: projects
            widget: list
            summary: "{{fields.title}}"
            fields: &item
              - {label: Judul, name: title, widget: string}
              - {label: Peran / Instansi, name: org, widget: string, required: false}
              - {label: Periode, name: period, widget: string, required: false}
              - {label: Deskripsi, name: description, widget: text, required: false}
              - {label: Poin-poin, name: points, widget: list, required: false, field: {label: Poin, name: poin, widget: text}}
              - {label: Link, name: link, widget: string, required: false}
          - {label: Penghargaan, name: awards, widget: list, summary: "{{fields.title}}", fields: *item}
          - {label: Pengalaman kerja dan akademik, name: experience, widget: list, summary: "{{fields.title}}", fields: *item}
          - {label: Kepemimpinan dan organisasi, name: leadership, widget: list, summary: "{{fields.title}}", fields: *item}
          - {label: Pendidikan, name: education, widget: list, summary: "{{fields.title}}", fields: *item}
          - label: Keterampilan
            name: skills
            widget: list
            summary: "{{fields.group}}"
            fields:
              - {label: Kelompok, name: group, widget: string}
              - {label: Daftar keterampilan, name: items, widget: list, field: {label: Keterampilan, name: item, widget: string}}
